<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員情報の編集</title>
</head>

<body>

<h1>会員情報の編集</h1>

<form th:action="@{/update}" method="post">
    <input
            type="hidden"
            name="id"
            th:value="${user.id}">

    <div>
        <label for="name">名前</label>
        <input
                type="text"
                id="name"
                name="name"
                th:value="${user.name}"
                required>
    </div>

    <div>
        <label for="password">新しいパスワード</label>
        <input
                type="password"
                id="password"
                name="password"
                placeholder="新しいパスワードを入力してください"
                minlength="4"
                required>
    </div>

    <div>
        <label for="email">メールアドレス</label>
        <input
                type="email"
                id="email"
                name="email"
                th:value="${user.email}"
                required>
    </div>

    <button type="submit">更新する</button>
</form>

<a th:href="@{/users}">会員一覧に戻る</a>

</body>
</html>
