<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>会員一覧</title>
</head>

<body>

<h1>会員一覧</h1>

<a th:href="@{/signup}">会員登録</a>

<table border="1">
    <thead>
    <tr>
        <th>ID</th>
        <th>名前</th>
        <th>メールアドレス</th>
        <th>管理</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>
        <td th:text="${user.name}"></td>
        <td th:text="${user.email}"></td>

        <td>
            <a th:href="@{/edit(id=${user.id})}">編集</a>

            <form th:action="@{/delete}"
                  method="post"
                  style="display: inline;">

                <input type="hidden"
                       name="id"
                       th:value="${user.id}">

                <button type="submit"
                        onclick="return confirm('本当に削除しますか？')">
                    削除
                </button>
            </form>
        </td>
    </tr>
    </tbody>
</table>

</body>
</html>
